[project]
name = "event-scraper-sp"
version = "0.1.0"
description = "Scraper de eventos de música eletrônica em São Paulo para o calendário WNXT"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<0.29",
  "selectolax>=0.3.21",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "structlog>=24.1,<26",
  "python-dotenv>=1.0,<2",
  # Windows/macOS have no system tz database, so ZoneInfo("America/Sao_Paulo") fails there.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "respx>=0.21,<0.23",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs network and/or real Supabase (RUN_INTEGRATION=1)"]

[tool.coverage.run]
source = ["src/scrapers", "src/db", "src/models", "src/pipeline.py"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
